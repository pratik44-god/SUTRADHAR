services:
  sutradhar-postgres:
    image: postgres:15
    restart: unless-stopped
    container_name: sutradhar-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sutradhar

    ports:
      - "5433:5432"

    volumes:
      - sutradhar_pg_data:/var/lib/postgresql/data

volumes:
  sutradhar_pg_data: